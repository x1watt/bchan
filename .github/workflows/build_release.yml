name: Build APK

# Compiles bchan on GitHub's runners and publishes the signed APKs to a
# GitHub Release, so users can download them directly.
#
# Triggers:
#   - pushing a tag like `v1.12.1` (or any `v*`) -> release named after the tag
#   - manual run from the Actions tab (workflow_dispatch) -> release `v<run_number>`

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APKs
        run: |
          set -euo pipefail

          # Use a committed keystore if one is provided via secrets, otherwise
          # generate an ephemeral one so the build is fully self-contained.
          KEYSTORE="$RUNNER_TEMP/release.jks"
          STORE_PASS="${SIGNING_STORE_PASSWORD:-bchan-ci}"
          KEY_PASS="${SIGNING_KEY_PASSWORD:-$STORE_PASS}"
          ALIAS="${SIGNING_ALIAS:-bchan}"

          if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            echo "Using keystore from repository secrets"
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          else
            echo "No SIGNING_KEYSTORE_BASE64 secret found; generating an ephemeral keystore"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=bchan, OU=geograms, O=geograms, C=US"
          fi

          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          echo "Using build-tools at $BUILD_TOOLS"

          mkdir -p artifacts
          for apk in app/build/outputs/apk/release/*-unsigned.apk; do
            aligned="$RUNNER_TEMP/$(basename "${apk%.apk}")-aligned.apk"
            "$BUILD_TOOLS/zipalign" -p -f 4 "$apk" "$aligned"

            # Map gradle output names to friendly release asset names.
            base="$(basename "$apk")"
            case "$base" in
              *universal*) out="bchan.apk" ;;
              *arm64-v8a*) out="bchan-arm64-v8a.apk" ;;
              *armeabi-v7a*) out="bchan-armeabi-v7a.apk" ;;
              *x86_64*) out="bchan-x86_64.apk" ;;
              *x86*) out="bchan-x86.apk" ;;
              *) out="$base" ;;
            esac

            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$STORE_PASS" \
              --key-pass "pass:$KEY_PASS" \
              --out "artifacts/$out" \
              "$aligned"
          done

          echo "Signed artifacts:"
          ls -la artifacts
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}

      - name: Upload APKs as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bchan-apks
          path: artifacts/*.apk

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: bchan ${{ steps.tag.outputs.tag }}
          body: |
            Automated build of bchan.

            **Download `bchan.apk`** if you are unsure which file to pick; it works on
            all devices. The per-architecture APKs are smaller alternatives.
          files: artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
